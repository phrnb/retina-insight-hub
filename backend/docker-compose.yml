
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/retinascan
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-for-development}
    restart: unless-stopped

  db:
    image: postgres:16.1
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=retinascan
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
